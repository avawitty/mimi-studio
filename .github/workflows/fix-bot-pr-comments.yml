name: Fix bot PR comments

# Fires when review bots leave feedback; launches a Cursor cloud agent via SDK.
# Requires repo secret CURSOR_API_KEY. Without it the job is skipped.

on:
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to sweep (required for manual runs)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  fix-bot-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(
          fromJSON('["vercel[bot]","chatgpt-codex-connector[bot]","cursor[bot]","copilot-pull-request-reviewer[bot]","github-actions[bot]"]'),
          github.event.comment.user.login
        )
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(
          fromJSON('["vercel[bot]","chatgpt-codex-connector[bot]","cursor[bot]","copilot-pull-request-reviewer[bot]","github-actions[bot]"]'),
          github.event.review.user.login
        )
      )

    steps:
      - name: Skip noisy bot comments
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
        run: |
          body="$(printf '%s' "$COMMENT_BODY" | tr '[:upper:]' '[:lower:]')"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if printf '%s' "$body" | grep -Eq 'usage limit reached|bugbot couldn|\[vc\]:'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping non-actionable bot noise"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check CURSOR_API_KEY
        id: secret
        if: steps.gate.outputs.skip != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "CURSOR_API_KEY secret not set — skipping agent launch."
            echo "Activate the Cursor Automation in docs/automations/fix-bot-pr-comments.md instead,"
            echo "or add CURSOR_API_KEY under repo Settings → Secrets."
            exit 0
          fi
          echo "has_key=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.skip != 'true' && steps.secret.outputs.has_key == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.gate.outputs.skip != 'true' && steps.secret.outputs.has_key == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true' && steps.secret.outputs.has_key == 'true'
        run: npm ci

      - name: Resolve PR context
        id: ctx
        if: steps.gate.outputs.skip != 'true' && steps.secret.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$PR_NUMBER_INPUT"
          elif [ "$EVENT_NAME" = "pull_request_review_comment" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          meta="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json url,headRefName,baseRefName)"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(echo "$meta" | jq -r .url)" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$meta" | jq -r .headRefName)" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$meta" | jq -r .baseRefName)" >> "$GITHUB_OUTPUT"

      - name: Launch Cursor cloud agent
        if: steps.gate.outputs.skip != 'true' && steps.secret.outputs.has_key == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_SDK_MODEL: ${{ vars.CURSOR_SDK_MODEL || 'composer-2' }}
          REPO_URL: https://github.com/${{ github.repository }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
          PR_URL: ${{ steps.ctx.outputs.pr_url }}
          COMMENT_URL: ${{ github.event.comment.html_url || github.event.review.html_url || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body || '' }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login || '' }}
        run: npm run cursor:fix-bot-comments

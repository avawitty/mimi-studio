<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Mimi">
  <title>Mimi</title>
  <style>
    .frame { fill: #fafafa; stroke: #17140f; stroke-width: 1; }
    .mark { fill: #17140f; }
    .reg { stroke: #17140f; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #0a0a0a; stroke: #f4f0e6; }
      .mark { fill: #f4f0e6; }
      .reg { stroke: #f4f0e6; }
    }
  </style>
  <!-- Cropped "mi" app mark — same family as brand/official/mimi-app-icon-crop-* -->
  <rect class="frame" x="18" y="18" width="204" height="204" />
  <defs>
    <clipPath id="favicon-crop">
      <rect x="18" y="18" width="204" height="204" />
    </clipPath>
  </defs>
  <g clip-path="url(#favicon-crop)">
    <text
      class="mark"
      x="-44"
      y="171"
      font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif"
      font-weight="500"
      font-size="222"
      text-anchor="start"
      letter-spacing="-7"
    >mi</text>
  </g>
  <g class="reg" fill="none" stroke-linecap="square">
    <line x1="209" y1="27.15" x2="209" y2="35.675" stroke-width="0.374" />
    <line x1="206.8" y1="31.4125" x2="212.025" y2="31.4125" stroke-width="0.337" />
  </g>
</svg>
